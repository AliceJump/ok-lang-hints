<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-__CSP_NONCE__'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
  :root {
    --border: var(--vscode-panel-border, rgba(128,128,128,.28));
    --muted: var(--vscode-descriptionForeground, rgba(180,180,180,.75));
    --surface: var(--vscode-editorWidget-background, rgba(128,128,128,.06));
    --surface2: var(--vscode-sideBar-background, rgba(128,128,128,.05));
    --selected: var(--vscode-list-activeSelectionBackground, rgba(0,122,204,.28));
    --selected-fg: var(--vscode-list-activeSelectionForeground, inherit);
    --hover: var(--vscode-list-hoverBackground, rgba(128,128,128,.12));
    --accent: var(--vscode-focusBorder, #007acc);
    --danger: var(--vscode-errorForeground, #f48771);
    --warning: var(--vscode-editorWarning-foreground, #cca700);
    --info: var(--vscode-editorInfo-foreground, #75beff);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--vscode-editor-foreground);
    background: var(--vscode-editor-background);
    font-family: var(--vscode-font-family);
    font-size: var(--vscode-font-size, 13px);
    overflow: hidden;
  }
  button, input, select {
    font: inherit;
    color: inherit;
  }
  button {
    border: 1px solid transparent;
    border-radius: 4px;
    background: var(--vscode-button-background);
    color: var(--vscode-button-foreground);
    padding: 5px 10px;
    cursor: pointer;
  }
  button:hover { background: var(--vscode-button-hoverBackground); }
  button.secondary {
    background: var(--vscode-button-secondaryBackground);
    color: var(--vscode-button-secondaryForeground);
  }
  button.secondary:hover { background: var(--vscode-button-secondaryHoverBackground); }
  button.icon { padding: 4px 7px; min-width: 28px; }
  input, select {
    border: 1px solid var(--vscode-input-border, transparent);
    border-radius: 3px;
    background: var(--vscode-input-background);
    color: var(--vscode-input-foreground);
    padding: 5px 8px;
    outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  #app { height: 100%; display: flex; flex-direction: column; }
  .topbar {
    flex: 0 0 auto;
    border-bottom: 1px solid var(--border);
    background: var(--vscode-titleBar-activeBackground, var(--vscode-editor-background));
  }
  .title-row {
    min-height: 42px;
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 7px 12px;
  }
  .title {
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
  }
  #project { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spacer { flex: 1; }
  #globalSearch { width: min(360px, 35vw); }
  .tabs { display: flex; gap: 2px; padding: 0 10px; }
  .tab {
    border: none;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    background: transparent;
    color: var(--muted);
    padding: 7px 11px 6px;
  }
  .tab:hover { background: var(--hover); color: inherit; }
  .tab.active { border-bottom-color: var(--accent); color: inherit; font-weight: 600; }
  .badge {
    display: inline-block;
    min-width: 18px;
    margin-left: 5px;
    border-radius: 10px;
    padding: 0 5px;
    background: var(--vscode-badge-background);
    color: var(--vscode-badge-foreground);
    font-size: 10px;
    line-height: 17px;
    text-align: center;
  }
  .summary {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(7, minmax(92px, 1fr));
    gap: 6px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }
  .metric {
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--surface);
    padding: 6px 8px;
  }
  .metric-value { font-size: 17px; font-weight: 700; }
  .metric-label { color: var(--muted); font-size: 10px; margin-top: 1px; }
  .metric.error .metric-value { color: var(--danger); }
  .metric.warning .metric-value { color: var(--warning); }
  .content { flex: 1 1 auto; min-height: 0; position: relative; }
  .view { display: none; height: 100%; min-height: 0; }
  .view.active { display: flex; }
  .split { width: 100%; min-width: 0; }
  .sidebar {
    flex: 0 0 300px;
    min-width: 220px;
    max-width: 420px;
    border-right: 1px solid var(--border);
    background: var(--surface2);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .filters {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
    padding: 8px;
    border-bottom: 1px solid var(--border);
  }
  .filters select { min-width: 0; width: 100%; }
  .filter-check {
    grid-column: 1 / -1;
    color: var(--muted);
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .filter-check input { width: auto; }
  .list-head {
    display: flex;
    align-items: center;
    padding: 6px 9px;
    color: var(--muted);
    font-size: 11px;
    border-bottom: 1px solid var(--border);
  }
  .scroll { overflow: auto; min-height: 0; scrollbar-color: var(--vscode-scrollbarSlider-background) transparent; }
  #characterList { flex: 1 1 auto; }
  .character-item {
    display: grid;
    grid-template-columns: 34px minmax(0, 1fr) auto;
    gap: 8px;
    align-items: center;
    padding: 7px 9px;
    border-bottom: 1px solid rgba(128,128,128,.1);
    cursor: pointer;
  }
  .character-item:hover { background: var(--hover); }
  .character-item.selected { background: var(--selected); color: var(--selected-fg); }
  .avatar {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-weight: 700;
    background: color-mix(in srgb, var(--accent) 22%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
  }
  .item-main { min-width: 0; }
  .item-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-sub { color: var(--muted); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-count { color: var(--muted); font-size: 10px; }
  .issue-dot {
    display: inline-block;
    min-width: 16px;
    padding: 0 4px;
    margin-left: 4px;
    text-align: center;
    border-radius: 8px;
    color: #fff;
    background: var(--warning);
  }
  .issue-dot.error { background: var(--danger); }
  .detail {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  #characterDetail { flex: 1 1 auto; padding: 12px 14px 28px; }
  .character-header {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 12px;
    align-items: start;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
    margin-bottom: 10px;
  }
  .character-title { font-size: 23px; font-weight: 700; }
  .character-id { color: var(--muted); font-family: var(--vscode-editor-font-family); font-size: 11px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    padding: 2px 7px;
    font-size: 11px;
  }
  .chip.effect { cursor: pointer; font-family: var(--vscode-editor-font-family); }
  .chip.effect:hover { border-color: var(--accent); }
  .chip.unknown { border-color: var(--danger); color: var(--danger); }
  .chip.inferred { border-style: dashed; }
  .locales-inline {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
    gap: 4px 10px;
    margin-top: 8px;
  }
  .locale-name { display: flex; gap: 6px; min-width: 0; font-size: 11px; }
  .locale-key { color: var(--muted); width: 48px; flex: 0 0 auto; }
  .locale-value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .section-title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
    margin: 13px 0 7px;
  }
  .skill-card {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    margin-bottom: 8px;
    overflow: hidden;
  }
  .skill-head {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 8px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }
  .skill-name { font-size: 14px; font-weight: 700; }
  .skill-id { color: var(--muted); font-family: var(--vscode-editor-font-family); font-size: 10px; }
  .skill-meta { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }
  .skill-body { padding: 8px 10px 10px; }
  .description { line-height: 1.55; white-space: pre-wrap; }
  .kv-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 5px 12px;
    margin: 7px 0;
    font-size: 11px;
  }
  .kv-key { color: var(--muted); margin-right: 5px; }
  .effect-line { margin-top: 7px; }
  .line-label { color: var(--muted); font-size: 11px; margin-bottom: 4px; }
  .enhancement {
    border-left: 3px solid var(--accent);
    padding: 7px 9px;
    margin-top: 8px;
    background: color-mix(in srgb, var(--accent) 7%, transparent);
    border-radius: 0 4px 4px 0;
  }
  .enhancement-name { font-weight: 700; }
  .enhancement-trigger { margin-top: 4px; line-height: 1.4; }
  .pulse { color: var(--info); font-size: 10px; margin-left: 5px; }
  .empty {
    padding: 36px 20px;
    text-align: center;
    color: var(--muted);
    line-height: 1.7;
  }
  .table-wrap { width: 100%; overflow: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 11px; }
  th, td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
  th { position: sticky; top: 0; z-index: 2; background: var(--vscode-editorWidget-background); white-space: nowrap; }
  td.sticky, th.sticky { position: sticky; left: 0; z-index: 3; background: var(--vscode-editor-background); min-width: 175px; }
  th.sticky { z-index: 4; background: var(--vscode-editorWidget-background); }
  .missing-cell { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
  .effect-toolbar, .issues-toolbar, .locale-toolbar {
    flex: 0 0 auto;
    display: flex;
    gap: 7px;
    align-items: center;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }
  .effect-toolbar input, .issues-toolbar input { flex: 1; min-width: 160px; }
  #effectList, #issueList { flex: 1 1 auto; padding: 8px 10px 24px; }
  .effect-card {
    display: grid;
    grid-template-columns: minmax(210px, .8fr) minmax(260px, 1.2fr) 72px;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    padding: 8px 7px;
  }
  .effect-card:hover { background: var(--hover); }
  .effect-id { font-family: var(--vscode-editor-font-family); font-weight: 700; word-break: break-all; }
  .effect-desc { line-height: 1.4; }
  .usage-list { margin-top: 5px; color: var(--muted); font-size: 10px; }
  .usage { cursor: pointer; margin: 2px 0; }
  .usage:hover { color: inherit; text-decoration: underline; }
  .severity { font-weight: 700; text-transform: uppercase; font-size: 10px; }
  .severity.error { color: var(--danger); }
  .severity.warning { color: var(--warning); }
  .severity.info { color: var(--info); }
  .issue-row {
    display: grid;
    grid-template-columns: 62px 145px minmax(0, 1fr) auto;
    gap: 9px;
    align-items: start;
    padding: 7px 6px;
    border-bottom: 1px solid var(--border);
  }
  .issue-row:hover { background: var(--hover); }
  .issue-code { color: var(--muted); font-family: var(--vscode-editor-font-family); font-size: 10px; }
  #loading, #fatal {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    background: color-mix(in srgb, var(--vscode-editor-background) 92%, transparent);
    padding: 24px;
    text-align: center;
  }
  #loading.show, #fatal.show { display: flex; }
  #fatal { color: var(--danger); }
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(0,0,0,.58);
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    width: min(760px, 94vw);
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--vscode-editorWidget-background);
    box-shadow: 0 12px 36px rgba(0,0,0,.42);
  }
  .modal-head, .modal-actions {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  .modal-actions { justify-content: flex-end; border-bottom: none; border-top: 1px solid var(--border); }
  .modal-title { font-size: 15px; font-weight: 700; }
  .modal-body { overflow: auto; padding: 12px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 12px; }
  .form-field { min-width: 0; }
  .form-field.wide { grid-column: 1 / -1; }
  .form-field label { display: block; margin-bottom: 3px; color: var(--muted); font-size: 11px; }
  .form-field input, .form-field select, .form-field textarea { width: 100%; }
  .form-field textarea { min-height: 76px; resize: vertical; }
  .form-field textarea.json { min-height: 125px; font-family: var(--vscode-editor-font-family); font-size: 11px; }
  .effect-editor { display: grid; grid-template-columns: minmax(230px, .8fr) minmax(300px, 1.2fr); gap: 10px; }
  .effect-select { min-height: 210px; font-family: var(--vscode-editor-font-family); font-size: 11px; }
  .effect-editor-hint { color: var(--muted); font-size: 10px; margin-top: 4px; }
  .effect-params { display: flex; flex-direction: column; gap: 6px; max-height: 310px; overflow: auto; }
  .effect-param-row { border: 1px solid var(--border); border-radius: 5px; padding: 6px 7px; background: var(--surface); }
  .effect-param-title { font-family: var(--vscode-editor-font-family); font-size: 11px; font-weight: 700; margin-bottom: 5px; }
  .effect-param-desc { color: var(--muted); font-size: 10px; margin-bottom: 5px; }
  .effect-param-grid { display: grid; grid-template-columns: repeat(4, minmax(70px, 1fr)); gap: 5px; }
  .effect-param-grid label { color: var(--muted); font-size: 9px; }
  .effect-param-grid input, .effect-param-grid select { width: 100%; margin-top: 2px; }
  .form-check { display: flex; align-items: center; gap: 6px; min-height: 30px; }
  .form-check input { width: auto; }
  .form-error { color: var(--danger); min-height: 18px; margin-top: 7px; white-space: pre-wrap; }
  .danger-button { background: var(--vscode-inputValidation-errorBackground, #5a1d1d); color: var(--vscode-errorForeground, #fff); }
  @media (max-width: 900px) {
    .summary { grid-template-columns: repeat(4, 1fr); }
    .sidebar { flex-basis: 240px; }
    .effect-card { grid-template-columns: 1fr; }
    .issue-row { grid-template-columns: 60px 120px minmax(0,1fr); }
    .issue-row button { grid-column: 3; justify-self: start; }
    .form-grid { grid-template-columns: 1fr; }
    .form-field.wide { grid-column: 1; }
    .effect-editor { grid-template-columns: 1fr; }
    .effect-param-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="title-row">
      <div class="title"></div>
      <div id="project"></div>
      <div class="spacer"></div>
      <input id="globalSearch" type="search">
      <button id="refresh" class="secondary icon">↻</button>
    </div>
    <nav class="tabs">
      <button class="tab active" data-tab="characters"><span id="charactersBadge" class="badge">0</span></button>
      <button class="tab" data-tab="effects"><span id="effectsBadge" class="badge">0</span></button>
      <button class="tab" data-tab="locales"><span id="localesBadge" class="badge">0</span></button>
      <button class="tab" data-tab="issues"><span id="issuesBadge" class="badge">0</span></button>
    </nav>
  </header>
  <section id="summary" class="summary"></section>
  <main class="content">
    <section id="charactersView" class="view active split">
      <aside class="sidebar">
        <div class="filters">
          <select id="starFilter"><option value=""></option></select>
          <select id="elementFilter"><option value=""></option></select>
          <select id="professionFilter"><option value=""></option></select>
          <select id="skillTypeFilter"><option value=""></option></select>
          <label class="filter-check"><input id="enhancementOnly" type="checkbox"><span></span></label>
          <label class="filter-check"><input id="issueOnly" type="checkbox"><span></span></label>
        </div>
        <div class="list-head"><span id="characterCount"></span><span class="spacer"></span><span></span></div>
        <div id="characterList" class="scroll"></div>
      </aside>
      <section class="detail"><div id="characterDetail" class="scroll"></div></section>
    </section>
    <section id="effectsView" class="view" style="flex-direction:column">
      <div class="effect-toolbar">
        <input id="effectSearch" type="search">
        <select id="effectCategory"><option value=""></option></select>
        <select id="effectUsage"><option value=""></option><option value="used"></option><option value="unused"></option><option value="unknown"></option></select>
        <button id="addEffectCategory" class="secondary"></button>
        <button id="addEffect"></button>
        <span id="effectCount" class="item-sub"></span>
      </div>
      <div id="effectList" class="scroll"></div>
    </section>
    <section id="localesView" class="view" style="flex-direction:column">
      <div class="locale-toolbar"><span></span><span class="item-sub"></span></div>
      <div id="localeTable" class="table-wrap"></div>
    </section>
    <section id="issuesView" class="view" style="flex-direction:column">
      <div class="issues-toolbar">
        <input id="issueSearch" type="search">
        <select id="issueSeverity"><option value=""></option><option value="error"></option><option value="warning"></option><option value="info"></option></select>
        <span id="issueCount" class="item-sub"></span>
      </div>
      <div id="issueList" class="scroll"></div>
    </section>
    <div id="loading"><div></div></div>
    <div id="fatal"></div>
  </main>
  <div id="modalBackdrop" class="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head"><div id="modalTitle" class="modal-title"></div><div class="spacer"></div><button id="modalClose" class="secondary icon">✕</button></div>
      <div id="modalBody" class="modal-body"></div>
      <div id="modalError" class="form-error" style="padding:0 12px"></div>
      <div class="modal-actions"><button id="modalCancel" class="secondary"></button><button id="modalSave"></button></div>
    </div>
  </div>
</div>
<script nonce="__CSP_NONCE__">
  const I18N = __I18N_JSON__;
  const t = (key, args = {}) => (I18N[key] || key).replace(/\{(\w+)\}/g, (_, name) => String(args[name] ?? '{' + name + '}'));
  const vscode = acquireVsCodeApi();
  const previousState = vscode.getState() || {};
  let snapshot = null;
  let activeTab = previousState.activeTab || 'characters';
  let selectedCharacterId = previousState.selectedCharacterId || '';
  let modalSubmit = null;

  const $ = (id) => document.getElementById(id);
  const text = (value) => value === undefined || value === null ? '' : String(value);
  const normalized = (value) => text(value).toLowerCase();
  const currentQuery = () => normalized($('globalSearch').value.trim());
  const saveState = () => vscode.setState({ activeTab, selectedCharacterId });

  function localizeStaticUi() {
    document.documentElement.lang = navigator.language || 'en';
    document.title = t('charactersTitle');
    document.querySelector('.title').textContent = t('charactersTitle');
    $('globalSearch').placeholder = t('searchCharacters');
    $('refresh').title = t('refresh');
    const tabs = { characters: 'charactersTab', effects: 'effectsTab', locales: 'localesTab', issues: 'issuesTab' };
    for (const node of document.querySelectorAll('.tab')) {
      const badge = node.querySelector('.badge');
      const label = document.createTextNode(t(tabs[node.dataset.tab]));
      node.replaceChildren(label, badge);
    }
    $('starFilter').options[0].textContent = t('allStars');
    $('elementFilter').options[0].textContent = t('allElements');
    $('professionFilter').options[0].textContent = t('allProfessions');
    $('skillTypeFilter').options[0].textContent = t('allSkillTypes');
    $('enhancementOnly').nextElementSibling.textContent = t('enhancementOnly');
    $('issueOnly').nextElementSibling.textContent = t('issueOnly');
    document.querySelector('.list-head > span:last-child').textContent = t('skillsEnhancements');
    $('effectSearch').placeholder = t('searchEffects');
    $('effectCategory').options[0].textContent = t('allCategories');
    $('effectUsage').options[0].textContent = t('allEffects');
    $('effectUsage').options[1].textContent = t('usedOnly');
    $('effectUsage').options[2].textContent = t('unusedOnly');
    $('effectUsage').options[3].textContent = t('unknownOnly');
    $('addEffectCategory').textContent = '＋ ' + t('addEffectCategory');
    $('addEffect').textContent = '＋ ' + t('addEffect');
    document.querySelector('.locale-toolbar > span:first-child').textContent = t('localizationMatrix');
    document.querySelector('.locale-toolbar > span:last-child').textContent = t('localizationHint');
    $('issueSearch').placeholder = t('searchIssues');
    $('issueSeverity').options[0].textContent = t('allSeverities');
    $('issueSeverity').options[1].textContent = t('error');
    $('issueSeverity').options[2].textContent = t('warning');
    $('issueSeverity').options[3].textContent = t('info');
    $('loading').firstElementChild.textContent = t('readingCharacterData');
    $('modalClose').title = t('close');
    $('modalCancel').textContent = t('cancel');
    $('modalSave').textContent = t('save');
  }

  function clear(element) { element.replaceChildren(); }
  function element(tag, className, content) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (content !== undefined) node.textContent = text(content);
    return node;
  }
  function button(label, className, handler, title) {
    const node = element('button', className, label);
    if (title) node.title = title;
    node.addEventListener('click', handler);
    return node;
  }
  function postOpen(kind, extra) { vscode.postMessage(Object.assign({ type: 'openSource', kind }, extra || {})); }
  function postCopy(value) { vscode.postMessage({ type: 'copy', text: value }); }
  function mutate(payload) { vscode.postMessage(Object.assign({ type: 'mutateCharacter' }, payload)); }
  function mutateEffect(payload) { vscode.postMessage(Object.assign({ type: 'mutateEffect' }, payload)); }

  function formField(label, input, wide) {
    const field = element('div', 'form-field' + (wide ? ' wide' : ''));
    field.appendChild(element('label', '', label));
    field.appendChild(input);
    return field;
  }

  function inputControl(value, type) {
    const input = document.createElement('input');
    input.type = type || 'text';
    input.value = value === undefined || value === null ? '' : String(value);
    return input;
  }

  function textareaControl(value, className) {
    const input = document.createElement('textarea');
    input.className = className || '';
    input.value = value === undefined || value === null ? '' : String(value);
    return input;
  }

  function selectControl(value, options) {
    const select = document.createElement('select');
    const all = [...new Set([value, ...options].filter(Boolean))];
    for (const option of all) select.appendChild(new Option(option, option));
    select.value = value || all[0] || '';
    return select;
  }

  function createEffectEditor(initialEffects, idsOnly) {
    const editor = element('div', 'effect-editor');
    const left = element('div');
    const select = document.createElement('select');
    select.className = 'effect-select';
    select.multiple = true;
    const initialMap = new Map();
    for (const effect of initialEffects || []) {
      const id = effect.effectId || effect.effect_id || (typeof effect === 'string' ? effect : '');
      if (id) initialMap.set(id, effect);
    }
    const effects = [...snapshot.effects];
    for (const id of initialMap.keys()) {
      if (!effects.some((effect) => effect.id === id)) effects.unshift({ id, category: '__undefined__', description: t('unknownCurrentEffect'), defined: false, usages: [] });
    }
    const categories = new Map();
    for (const effect of effects) {
      const category = effect.category === '__undefined__' ? t('undefinedEffect') : effect.category;
      const list = categories.get(category) || [];
      list.push(effect); categories.set(category, list);
    }
    for (const [category, items] of categories) {
      const group = document.createElement('optgroup'); group.label = category;
      for (const effect of items) {
        const option = new Option(effect.id + ' — ' + effect.description, effect.id);
        option.selected = initialMap.has(effect.id);
        group.appendChild(option);
      }
      select.appendChild(group);
    }
    left.appendChild(select);
    left.appendChild(element('div', 'effect-editor-hint', t('effectMultiHint')));
    editor.appendChild(left);
    const params = element('div', 'effect-params'); editor.appendChild(params);
    const values = new Map();

    const normalizeInitial = (id) => {
      const raw = initialMap.get(id);
      if (typeof raw === 'string' || !raw) return { effect_id: id, value: 0, duration: '', target: 'enemy', count: 1 };
      return {
        effect_id: id,
        value: raw.value === undefined ? 0 : raw.value,
        duration: raw.duration === undefined || raw.duration === null ? '' : raw.duration,
        target: raw.target || 'enemy',
        count: raw.count === undefined ? 1 : raw.count,
      };
    };

    const renderParams = () => {
      const selected = [...select.selectedOptions].map((option) => option.value);
      clear(params);
      if (idsOnly) {
        params.appendChild(element('div', 'empty', selected.length ? t('selectedTriggerEffects', { count: selected.length }) : t('noTriggerEffects')));
        return;
      }
      if (!selected.length) {
        params.appendChild(element('div', 'empty', t('noSelectedEffects')));
        return;
      }
      for (const id of selected) {
        if (!values.has(id)) values.set(id, normalizeInitial(id));
        const value = values.get(id);
        const row = element('div', 'effect-param-row');
        row.appendChild(element('div', 'effect-param-title', id));
        const definition = snapshot.effects.find((effect) => effect.id === id);
        row.appendChild(element('div', 'effect-param-desc', definition?.description || t('unknownEffect')));
        const grid = element('div', 'effect-param-grid');
        const valueInput = inputControl(value.value, 'number');
        const durationInput = inputControl(value.duration);
        const targetInput = selectControl(value.target, ['enemy', 'ally', 'self']);
        const countInput = inputControl(value.count, 'number');
        for (const [label, input, key, number] of [
          ['value', valueInput, 'value', true], ['duration', durationInput, 'duration', false],
          ['target', targetInput, 'target', false], ['count', countInput, 'count', true],
        ]) {
          const wrapper = element('label'); wrapper.textContent = label;
          input.addEventListener('change', () => { value[key] = number ? Number(input.value || 0) : input.value; });
          wrapper.appendChild(input); grid.appendChild(wrapper);
        }
        row.appendChild(grid); params.appendChild(row);
      }
    };
    select.addEventListener('change', renderParams);
    renderParams();
    return {
      element: editor,
      getValue: () => {
        const selected = [...select.selectedOptions].map((option) => option.value);
        if (idsOnly) return selected;
        return selected.map((id) => ({ ...normalizeInitial(id), ...(values.get(id) || {}), effect_id: id }));
      },
    };
  }

  function showModal(title, build, onSubmit, saveText) {

    $('modalError').textContent = '';

    const form = element('div', 'form-grid');
    const controls = build(form) || {};

    $('modalSave').textContent = saveText || t('save');

    $('modalBackdrop').classList.add('show');

  function closeModal() {

  function submitModal() {

    const value = skill || { skillId: character.characterId + '_skill', name: '', skillType: '战技', element: character.element, description: '', damageMultiplier: '', staggerValue: 0, cooldown: '', spiritCost: 0, effects: [] };

      const controls = {

        element: inputControl(value.element), damageMultiplier: inputControl(value.damageMultiplier), staggerValue: inputControl(value.staggerValue, 'number'),
        cooldown: inputControl(value.cooldown), spiritCost: inputControl(value.spiritCost, 'number'), description: textareaControl(value.description),

      };

      controls.element.disabled = synced;

      form.appendChild(formField(t('skillId'), controls.skillId)); form.appendChild(formField(t('skillName'), controls.name));
      form.appendChild(formField(t('skillType'), controls.skillType)); form.appendChild(formField(t('element'), controls.element));
      form.appendChild(formField(t('damageMultiplier'), controls.damageMultiplier)); form.appendChild(formField(t('staggerValue'), controls.staggerValue));
      form.appendChild(formField(t('cooldownField'), controls.cooldown)); form.appendChild(formField(t('spiritCostField'), controls.spiritCost));
      form.appendChild(formField(t('skillDescription'), controls.description, true)); form.appendChild(formField(t('baseEffectsMulti'), controls.effects.element, true));
      return controls;
    }, (controls) => {
      const data = {
        skillId: controls.skillId.value, name: controls.name.value, skillType: controls.skillType.value,
        element: controls.element.value, damageMultiplier: controls.damageMultiplier.value,
        staggerValue: Number(controls.staggerValue.value || 0), cooldown: controls.cooldown.value,
        spiritCost: Number(controls.spiritCost.value || 0), description: controls.description.value,
        effects: controls.effects.getValue(),
      };
      mutate({ action: editing ? 'updateSkill' : 'addSkill', characterId: character.characterId, skillId: editing ? skill.skillId : undefined, data });
    }, editing ? t('modify') : t('add'));

  function showEnhancementEditor(character, skill, enhancement, index) {
    const editing = !!enhancement;

    showModal(editing ? t('modifyEnhancement') : t('addEnhancement'), (form) => {

      form.appendChild(formField(t('triggerText'), controls.triggerText, true)); form.appendChild(formField(t('enhancementDescription'), controls.enhancementEffect, true));

  function showEffectCategoryEditor() {

      const controls = { effectId: inputControl(''), description: textareaControl(''), category: selectControl(categories[0] || '', categories) };

  function confirmDelete(label, callback) {
    if (confirm(t('confirmDelete', { name: label }))) callback();
  }

  function setTab(tab) {
    activeTab = tab;
    for (const node of document.querySelectorAll('.tab')) node.classList.toggle('active', node.dataset.tab === tab);
    for (const node of document.querySelectorAll('.view')) node.classList.remove('active');

  function renderSummary() {
    const summary = snapshot.summary;
    const metrics = [
      [t('charactersMetric'), summary.characters, ''],
      [t('skillsMetric'), summary.skills, ''],
      [t('enhancementsMetric'), summary.enhancements, ''],
      [t('effectReferencesMetric'), summary.effectReferences, ''],
      [t('effectDefinitionsMetric'), summary.definedEffects, ''],
      [t('error'), summary.errors, summary.errors ? 'error' : ''],
      [t('warning'), summary.warnings, summary.warnings ? 'warning' : ''],
    ];

    }
    $('charactersBadge').textContent = summary.characters;
    $('effectsBadge').textContent = snapshot.effects.length;
    $('localesBadge').textContent = summary.locales.length;

  function fillSelect(select, values, label) {
    const selected = select.value;
    select.replaceChildren(new Option(label, ''));
    for (const value of [...new Set(values.filter(Boolean))].sort((a, b) => text(a).localeCompare(text(b)))) select.appendChild(new Option(value, value));
    if ([...select.options].some((option) => option.value === selected)) select.value = selected;
  }

  function setupFilters() {
    fillSelect($('starFilter'), snapshot.characters.map((item) => item.star ? String(item.star) : t('unknownStar')), t('allStars'));
    fillSelect($('elementFilter'), snapshot.characters.map((item) => item.element || t('unknownElement')), t('allElements'));
    fillSelect($('professionFilter'), snapshot.characters.map((item) => item.profession || t('unknownProfession')), t('allProfessions'));
    fillSelect($('skillTypeFilter'), snapshot.characters.flatMap((item) => item.skills.map((skill) => skill.skillType)), t('allSkillTypes'));
    fillSelect($('effectCategory'), snapshot.effectCategories || snapshot.effects.map((item) => item.category).filter((category) => category !== '__undefined__'), t('allCategories'));
  }

  function characterHaystack(character) {
    const localeText = Object.values(character.locales || {}).join(' ');
    const skillText = character.skills.map((skill) => [
      skill.skillId, skill.name, skill.skillType, skill.element, skill.description,
      ...skill.effects.map((effect) => effect.effectId),
      ...skill.enhancements.flatMap((enhancement) => [
        enhancement.name, enhancement.triggerText, enhancement.enhancementEffect,
        ...enhancement.triggerEffects.map((effect) => effect.effectId),
        ...enhancement.effects.map((effect) => effect.effectId),
      ]),
    ].join(' ')).join(' ');
    return normalized([character.characterId, character.name, character.master?.en, localeText, character.element, character.profession, character.weaponType, skillText].join(' '));
  }

  function filteredCharacters() {
    const query = currentQuery();
    const star = $('starFilter').value;
    const elementFilter = $('elementFilter').value;
    const profession = $('professionFilter').value;
    const skillType = $('skillTypeFilter').value;
    return snapshot.characters.filter((character) => {
      if (query && !characterHaystack(character).includes(query)) return false;
      if (star && String(character.star || t('unknownStar')) !== star) return false;
      if (elementFilter && (character.element || t('unknownElement')) !== elementFilter) return false;
      if (profession && (character.profession || t('unknownProfession')) !== profession) return false;
      if (skillType && !character.skills.some((skill) => skill.skillType === skillType)) return false;
      if ($('enhancementOnly').checked && !character.skills.some((skill) => skill.enhancements.length)) return false;
      if ($('issueOnly').checked && !character.issueCount) return false;
      return true;
    });
  }

  function renderCharacterList() {
    const characters = filteredCharacters();
    $('characterCount').textContent = t('characterCount', { shown: characters.length, total: snapshot.characters.length });
    clear($('characterList'));
    if (!characters.length) {
      $('characterList').appendChild(element('div', 'empty', t('noCharacters')));
      renderCharacterDetail(null);
      return;
    }
    if (!characters.some((item) => item.characterId === selectedCharacterId)) selectedCharacterId = characters[0].characterId;
    for (const character of characters) {
      const item = element('div', 'character-item' + (character.characterId === selectedCharacterId ? ' selected' : ''));
      item.dataset.id = character.characterId;
      item.appendChild(element('div', 'avatar', character.name.slice(0, 1)));
      const main = element('div', 'item-main');
      main.appendChild(element('div', 'item-name', character.name));
      main.appendChild(element('div', 'item-sub', [character.star ? character.star + '★' : t('unknownStar'), character.element || t('unknownElement'), character.profession || t('unknownProfession')].join(' · ')));
      item.appendChild(main);
      const stats = element('div', 'item-count', character.skills.length + ' / ' + character.skills.reduce((sum, skill) => sum + skill.enhancements.length, 0));
      if (character.issueCount) stats.appendChild(element('span', 'issue-dot ' + (character.errorCount ? 'error' : ''), character.issueCount));
      item.appendChild(stats);
      item.addEventListener('click', () => {
        selectedCharacterId = character.characterId;
        saveState();
        renderCharacterList();
        renderCharacterDetail(character);
      });
      $('characterList').appendChild(item);
    }
    renderCharacterDetail(characters.find((item) => item.characterId === selectedCharacterId) || characters[0]);
  }

  function makeChip(label, className, title, onClick) {
    const chip = element('span', 'chip ' + (className || ''), label);
    if (title) chip.title = title;
    if (onClick) chip.addEventListener('click', onClick);
    return chip;
  }

  function effectDescription(effectId) {
    const effect = snapshot.effects.find((item) => item.id === effectId);
    return effect ? effect.description : t('undefinedEffect');
  }

  function focusEffect(effectId) {
    setTab('effects');
    $('effectSearch').value = effectId;
    renderEffects();
  }

  function appendEffectChips(container, effects) {
    if (!effects.length) {
      container.appendChild(element('span', 'item-sub', t('none')));
      return;
    }
    for (const effect of effects) {
      const suffix = [
        effect.value !== undefined && effect.value !== null ? t('valueLabel') + '=' + effect.value : '',
        effect.duration !== undefined && effect.duration !== null && effect.duration !== '' ? 'duration=' + effect.duration : '',
        effect.count !== undefined ? 'count=' + effect.count : '',
        effect.target ? 'target=' + effect.target : '',
      ].filter(Boolean).join(' · ');
      const title = effectDescription(effect.effectId) + (suffix ? '\n' + suffix : '') + (effect.inferred ? '\n' + t('inferredFromTriggerText') : '');
      container.appendChild(makeChip(effect.effectId, 'effect ' + (!effect.known ? 'unknown ' : '') + (effect.inferred ? 'inferred' : ''), title, () => focusEffect(effect.effectId)));
    }
  }

      head.appendChild(skillMeta);
      card.appendChild(head);
      const body = element('div', 'skill-body');

      const kv = element('div', 'kv-grid');
      const values = [
        [t('multiplier'), skill.damageMultiplier], [t('stagger'), skill.staggerValue || ''], [t('cooldown'), skill.cooldown], [t('spiritCost'), skill.spiritCost || ''],
      ].filter((entry) => entry[1] !== '');

        if (enhancement.enhancementEffect) block.appendChild(element('div', 'item-sub', enhancement.enhancementEffect));
        const triggerLine = element('div', 'effect-line');

        appendEffectChips(outputChips, enhancement.effects);
        outputLine.appendChild(outputChips);
        block.appendChild(outputLine);
        body.appendChild(block);
      }
      const addEnhancement = button('＋ ' + t('addEnhancement'), 'secondary', () => showEnhancementEditor(character, skill, null, -1));
      addEnhancement.style.marginTop = '8px';
      body.appendChild(addEnhancement);
      card.appendChild(body);
      $('characterDetail').appendChild(card);
    }
  }

  function effectHaystack(effect) {
    return normalized([effect.id, effect.description, effect.category, ...effect.usages.flatMap((usage) => [usage.characterName, usage.skillName, usage.enhancementName, usage.scope])].join(' '));
  }

  function renderEffects() {
    if (!snapshot) return;
    const query = normalized($('effectSearch').value.trim() || (activeTab === 'effects' ? $('globalSearch').value.trim() : ''));
    const category = $('effectCategory').value;
    const usage = $('effectUsage').value;
    const effects = snapshot.effects.filter((effect) => {
      if (query && !effectHaystack(effect).includes(query)) return false;
      if (category && effect.category !== category) return false;
      if (usage === 'used' && !effect.usages.length) return false;
      if (usage === 'unused' && effect.usages.length) return false;
      if (usage === 'unknown' && effect.defined) return false;
      return true;
    });
    $('effectCount').textContent = t('effectsCount', { shown: effects.length, total: snapshot.effects.length });
    clear($('effectList'));
    if (!effects.length) {
      $('effectList').appendChild(element('div', 'empty', t('noEffects')));
      return;
    }
    for (const effect of effects) {
      const card = element('div', 'effect-card');
      const left = element('div');
      const id = element('div', 'effect-id', effect.id);
      id.style.cursor = 'pointer'; id.title = t('clickCopyEffectId'); id.addEventListener('click', () => postCopy(effect.id));
      left.appendChild(id);
      const categoryLabel = effect.category === '__undefined__' ? t('undefinedEffect') : effect.category;
      left.appendChild(element('div', 'item-sub', categoryLabel + (effect.defined ? '' : ' · ' + t('undefinedEffect'))));
      const usageList = element('div', 'usage-list');
      const shown = effect.usages.slice(0, 8);
      for (const usageItem of shown) {
        const label = usageItem.characterName + ' / ' + usageItem.skillName + (usageItem.enhancementName ? ' / ' + usageItem.enhancementName : '') + ' · ' + usageItem.scope;
        const node = element('div', 'usage', label);
        node.addEventListener('click', () => {
          selectedCharacterId = usageItem.characterId;
          $('globalSearch').value = '';
          for (const id of ['starFilter', 'elementFilter', 'professionFilter', 'skillTypeFilter']) $(id).value = '';
          $('enhancementOnly').checked = false;
          $('issueOnly').checked = false;
          setTab('characters');
          renderCharacterList();
        });
        usageList.appendChild(node);
      }
      if (effect.usages.length > shown.length) usageList.appendChild(element('div', 'item-sub', t('moreUsages', { count: effect.usages.length - shown.length })));
      left.appendChild(usageList);
      card.appendChild(left);
      card.appendChild(element('div', 'effect-desc', effect.description));
      card.appendChild(button(t('openDefinition'), 'secondary', () => postOpen('effects', { effectId: effect.id })));
      $('effectList').appendChild(card);
    }
  }

  function renderLocales() {
    if (!snapshot) return;
    const query = currentQuery();
    const characters = snapshot.characters.filter((character) => !query || characterHaystack(character).includes(query));
    clear($('localeTable'));
    const table = element('table');
    const head = element('thead');
    const headRow = element('tr');
    headRow.appendChild(element('th', 'sticky', t('characterIdColumn')));
    for (const locale of snapshot.summary.locales) headRow.appendChild(element('th', '', locale));
    head.appendChild(headRow); table.appendChild(head);
    const body = element('tbody');
    for (const character of characters) {
      const row = element('tr');
      const first = element('td', 'sticky');
      const name = element('div', 'item-name', character.name);
      name.style.cursor = 'pointer'; name.title = t('openCharacterLocaleFile');
      name.addEventListener('click', () => postOpen('locale', { characterId: character.characterId }));
      first.appendChild(name);
      first.appendChild(element('div', 'item-sub', character.characterId));
      row.appendChild(first);
      for (const locale of snapshot.summary.locales) {
        const value = character.locales[locale] || '';
        row.appendChild(element('td', value ? '' : 'missing-cell', value || t('missing')));
      }
      body.appendChild(row);
    }
    table.appendChild(body); $('localeTable').appendChild(table);
  }

  function sourcePayload(source) {
    if (!source) return null;
    return {
      kind: source.kind,
      characterId: source.characterId,
      fileName: source.fileName,
      effectId: source.effectId,
      skillId: source.skillId,
    };
  }

  function renderIssues() {
    if (!snapshot) return;
    const query = normalized($('issueSearch').value.trim() || (activeTab === 'issues' ? $('globalSearch').value.trim() : ''));
    const severity = $('issueSeverity').value;
    const issues = snapshot.issues.filter((issue) => {
      if (severity && issue.severity !== severity) return false;
      if (query && !normalized([issue.code, issue.message, issue.source?.characterId, issue.source?.skillId, issue.source?.effectId].join(' ')).includes(query)) return false;
      return true;
    });
    $('issueCount').textContent = t('issuesCount', { shown: issues.length, total: snapshot.issues.length });
    clear($('issueList'));
    if (!issues.length) {
      $('issueList').appendChild(element('div', 'empty', snapshot.issues.length ? t('noIssuesMatch') : t('noIssues')));
      return;
    }
    for (const issue of issues) {
      const row = element('div', 'issue-row');
      row.appendChild(element('div', 'severity ' + issue.severity, issue.severity));
      row.appendChild(element('div', 'issue-code', issue.code));
      row.appendChild(element('div', '', issue.message));
      const payload = sourcePayload(issue.source);
      if (payload) row.appendChild(button(t('openSource'), 'secondary', () => postOpen(payload.kind, payload)));
      else row.appendChild(element('span'));
      $('issueList').appendChild(row);
    }
  }

  function applyAllFilters() {
    if (!snapshot) return;
    if (activeTab === 'characters') renderCharacterList();
    else if (activeTab === 'effects') renderEffects();
    else if (activeTab === 'locales') renderLocales();
    else if (activeTab === 'issues') renderIssues();
  }

  function renderData(data) {
    snapshot = data;
    $('project').textContent = data.projectDir;
    $('fatal').classList.remove('show');
    $('loading').classList.remove('show');
    renderSummary();
    setupFilters();
    if (!selectedCharacterId || !data.characters.some((item) => item.characterId === selectedCharacterId)) selectedCharacterId = data.characters[0]?.characterId || '';
    setTab(activeTab);
  }

  localizeStaticUi();
  for (const tab of document.querySelectorAll('.tab')) tab.addEventListener('click', () => setTab(tab.dataset.tab));
  $('refresh').addEventListener('click', () => vscode.postMessage({ type: 'refresh' }));
  $('globalSearch').addEventListener('input', applyAllFilters);
  for (const id of ['starFilter', 'elementFilter', 'professionFilter', 'skillTypeFilter', 'enhancementOnly', 'issueOnly']) $(id).addEventListener('change', renderCharacterList);
  for (const id of ['effectSearch', 'effectCategory', 'effectUsage']) $(id).addEventListener(id === 'effectSearch' ? 'input' : 'change', renderEffects);
  $('addEffectCategory').addEventListener('click', showEffectCategoryEditor);
  $('addEffect').addEventListener('click', showEffectEditor);
  $('issueSearch').addEventListener('input', renderIssues);
  $('issueSeverity').addEventListener('change', renderIssues);
  $('modalClose').addEventListener('click', closeModal);
  $('modalCancel').addEventListener('click', closeModal);
  $('modalSave').addEventListener('click', submitModal);
  $('modalBackdrop').addEventListener('click', (event) => { if (event.target === $('modalBackdrop')) closeModal(); });
  window.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && $('modalBackdrop').classList.contains('show')) closeModal();
  });

  window.addEventListener('message', (event) => {
    const message = event.data;
    if (message.type === 'loading') {
      $('project').textContent = message.projectDir || '';
      $('loading').classList.add('show');
      $('fatal').classList.remove('show');
    } else if (message.type === 'data') {
      renderData(message.snapshot);
    } else if (message.type === 'error') {
      $('loading').classList.remove('show');
      $('fatal').textContent = message.text || t('loadFailed');
      $('fatal').classList.add('show');
    } else if (message.type === 'mutationResult') {
      if (message.ok) closeModal();
      else $('modalError').textContent = message.text || t('saveFailed');
    }
  });

  vscode.postMessage({ type: 'ready' });
</script>
</body>
</html>
