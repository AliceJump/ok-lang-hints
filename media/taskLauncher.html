<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-__CSP_NONCE__'">
<title></title>
<style>
  body {
    color: var(--vscode-editor-foreground);
    background: var(--vscode-editor-background);
    font-family: var(--vscode-font-family);
    font-size: var(--vscode-font-size, 13px);
    margin: 0;
    padding: 10px 12px 20px;
  }
  .toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  button {
    background: var(--vscode-button-background);
    color: var(--vscode-button-foreground);
    border: none;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
  }
  button:hover { background: var(--vscode-button-hoverBackground); }
  button.secondary { background: var(--vscode-button-secondaryBackground); color: var(--vscode-button-secondaryForeground); }
  .task {
    border: 1px solid var(--vscode-panel-border, rgba(128,128,128,.25));
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 6px;
    background: var(--vscode-editorWidget-background, rgba(128,128,128,.06));
  }
  .task:hover { border-color: var(--vscode-focusBorder); }
  .task .name { font-weight: 600; margin-bottom: 2px; }
  .task .cls { opacity: .6; font-size: 11px; }
  .task .description { opacity: .75; font-size: 11px; margin-top: 4px; white-space: pre-wrap; }
  .task .kind { float: right; opacity: .75; font-size: 10px; font-weight: normal; }
  .task .launch-btn {
    margin-top: 6px;
    width: 100%;
  }
  .task .launch-btn:disabled { opacity: .5; cursor: not-allowed; }
  .task .stop-btn {
    margin-top: 6px;
    width: 100%;
    background: var(--vscode-button-secondaryBackground);
    color: var(--vscode-button-secondaryForeground);
  }
  .task .stop-btn:disabled { opacity: .5; cursor: not-allowed; }
  /* 参数配置区 */
  .cfg-toggle {
    margin-top: 6px;
    width: 100%;
    background: var(--vscode-button-secondaryBackground);
    color: var(--vscode-button-secondaryForeground);
  }
  .cfg-panel {
    display: none;
    margin-top: 8px;
    border-top: 1px solid var(--vscode-panel-border, rgba(128,128,128,.2));
    padding-top: 8px;
  }
  .cfg-panel.open { display: block; }
  .cfg-field { margin-bottom: 8px; }
  .cfg-field.cfg-subconfig {
    margin-left: 12px;
    padding-left: 9px;
    border-left: 2px solid var(--vscode-panel-border, rgba(128,128,128,.22));
  }
  .cfg-field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 2px;
    cursor: pointer;
  }
  .cfg-field .cfg-desc {
    font-size: 11px;
    opacity: .6;
    margin-bottom: 4px;
    white-space: pre-wrap;
    line-height: 1.4;
  }
  .cfg-field select,
  .cfg-field input[type=text],
  .cfg-field input[type=number],
  .cfg-field textarea {
    width: 100%;
    box-sizing: border-box;
    background: var(--vscode-input-background);
    color: var(--vscode-input-foreground);
    border: 1px solid var(--vscode-input-border, transparent);
    border-radius: 3px;
    padding: 3px 6px;
    font-size: 12px;
  }
  .cfg-field textarea { min-height: 72px; resize: vertical; font-family: inherit; }
  .cfg-field input[type=checkbox] { accent-color: var(--vscode-focusBorder); }
  .cfg-actions {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }
  .cfg-actions button { flex: 1; }
  .cfg-section-title { font-size: 11px; font-weight: 700; opacity: .75; margin: 10px 0 6px; }
  .cfg-fields { display: flex; flex-direction: column; gap: 2px; }
  .cfg-group {
    border: 1px solid var(--vscode-panel-border, rgba(128,128,128,.22));
    border-radius: 5px;
    margin: 4px 0;
    overflow: hidden;
  }
  .cfg-group-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 6px;
    background: var(--vscode-sideBarSectionHeader-background, rgba(128,128,128,.08));
  }
  .cfg-group-header .cfg-field { flex: 1; margin: 0; min-width: 0; }
  .cfg-group-title { flex: 1; font-size: 12px; font-weight: 600; }
  .cfg-group-count { opacity: .55; font-size: 10px; font-weight: 400; margin-left: 4px; }
  .cfg-group-toggle { flex: 0 0 auto; min-width: 28px; padding: 3px 7px; }
  .cfg-group-body { display: none; padding: 5px 7px 5px 12px; }
  .cfg-group.open > .cfg-group-body { display: block; }
  .cfg-json-error { border-color: var(--vscode-inputValidation-errorBorder, #be1100) !important; }
  .cfg-json-hint { margin-top: 3px; font-size: 10px; opacity: .6; }
  .cfg-broken { opacity: .7; font-size: 12px; margin-top: 6px; }
  .cfg-empty { opacity: .6; font-size: 12px; margin-top: 6px; }
  .status { margin-top: 8px; padding: 6px 8px; border-radius: 4px; font-size: 12px; }
  .status.warn { background: var(--vscode-inputValidation-warningBackground, rgba(255,193,7,.15)); }
  .status.error { background: var(--vscode-inputValidation-errorBackground, rgba(255,0,0,.15)); }
  .status.ok { background: var(--vscode-inputValidation-infoBackground, rgba(0,122,204,.15)); }
  .empty { opacity: .6; text-align: center; margin-top: 32px; line-height: 1.8; }
</style>
</head>
<body>
  <div class="toolbar">
    <button id="refresh" class="secondary"></button>
  </div>
  <div id="tasks"></div>
  <div id="status" class="status" style="display:none"></div>
  <div id="empty" class="empty" style="display:none;white-space:pre-line"></div>
<script nonce="__CSP_NONCE__">
  const I18N = __I18N_JSON__;
  const t = (key, args = {}) => (I18N[key] || key).replace(/\{(\w+)\}/g, (_, name) => String(args[name] ?? '{' + name + '}'));
  const vscode = acquireVsCodeApi();
  const tasksEl = document.getElementById('tasks');
  const statusEl = document.getElementById('status');
  const emptyEl = document.getElementById('empty');
  const refreshBtn = document.getElementById('refresh');
  let running = false;
  // 已加载的 schema 与任务配置均以 module::className 为键。
  let schemas = {};
  let taskConfigs = {};
  let currentTasks = [];
  let runningTaskKey = '';
  const openPanels = new Set();
  const openConfigGroups = new Map();
  document.title = t('taskTitle');
  refreshBtn.textContent = '↻ ' + t('refresh');
  emptyEl.textContent = t('noTasks');

  function setStatus(level, text) {
    if (!text) { statusEl.style.display = 'none'; return; }
    statusEl.style.display = '';
    statusEl.className = 'status ' + level;
    statusEl.textContent = text;
  }

  function taskKey(task) { return task.module + '::' + task.className; }

  /** 渲染单个参数字段控件；值变更时实时写回 config.params */
  function buildField(container, task, field, config, onChange) {
    const row = document.createElement('div');
    row.className = 'cfg-field';
    const label = document.createElement('label');
    label.textContent = field.displayKey || field.key;
    label.title = field.key;
    row.appendChild(label);
    if (field.displayDesc || field.desc) {
      const d = document.createElement('div');
      d.className = 'cfg-desc';
      d.textContent = field.displayDesc || field.desc;
      row.appendChild(d);
    }
    const setValue = (v) => {
      config.params = config.params || {};
      config.params[field.key] = v;
      if (onChange) onChange();
    };
    const typeMeta = field.type || {};
    const rawValue = config.params && field.key in config.params
      ? config.params[field.key]
      : (field.value !== undefined ? field.value : field.default);
    const typeName = String(typeMeta.type || '');
    const options = Array.isArray(typeMeta.options) ? typeMeta.options : [];
    const optionsAvailable = Array.isArray(typeMeta.options_available) ? typeMeta.options_available : [];
    const optionLabels = Array.isArray(typeMeta.option_labels) ? typeMeta.option_labels : [];

    // 1) cascade_drop_down：按分类分组选项
    if (typeName === 'cascade_drop_down' && typeMeta.options && typeof typeMeta.options === 'object') {
      const sel = document.createElement('select');
      let selected = false;
      for (const [category, values] of Object.entries(typeMeta.options)) {
        if (!Array.isArray(values)) continue;
        const group = document.createElement('optgroup');
        group.label = String((typeMeta.category_labels && typeMeta.category_labels[category]) || (typeMeta.labels && typeMeta.labels[category]) || category);
        for (let valueIndex = 0; valueIndex < values.length; valueIndex++) {
          const value = values[valueIndex];
          const option = document.createElement('option');
          option.value = JSON.stringify(value);
          option.textContent = String((typeMeta.option_labels && typeMeta.option_labels[category] && typeMeta.option_labels[category][valueIndex]) || value);
          if (String(value) === String(rawValue)) { option.selected = true; selected = true; }
          group.appendChild(option);
        }
        sel.appendChild(group);
      }
      if (!selected && rawValue !== undefined && rawValue !== null) {
        const group = document.createElement('optgroup'); group.label = t('current');
        const option = document.createElement('option'); option.value = JSON.stringify(rawValue); option.textContent = t('currentValue', { value: rawValue }); option.selected = true;
        group.appendChild(option); sel.insertBefore(group, sel.firstChild);
      }
      sel.addEventListener('change', () => { try { setValue(JSON.parse(sel.value)); } catch {} });
      row.appendChild(sel);
    // 2) drop_down（显式或仅声明 options）：下拉
    } else if ((typeName === 'drop_down' || (!typeName && options.length && !Array.isArray(rawValue))) && options.length) {
      const sel = document.createElement('select');
      const cur = String(rawValue === undefined ? '' : rawValue);
      let hasCur = false;
      for (let index = 0; index < options.length; index++) {
        const op = options[index];
        const o = document.createElement('option');
        o.value = String(index);
        o.textContent = String(optionLabels[index] || op);
        if (String(op) === cur) { o.selected = true; hasCur = true; }
        sel.appendChild(o);
      }
      if (!hasCur) {
        const o = document.createElement('option');
        o.value = '-1'; o.textContent = t('currentValue', { value: cur }); o.selected = true;
        sel.appendChild(o);
      }
      sel.addEventListener('change', () => {
        const index = Number(sel.value);
        if (index >= 0 && index < options.length) setValue(options[index]);
      });
      row.appendChild(sel);
    } else if (typeof rawValue === 'boolean') {
      // 3) 布尔：开关
      const wrap = document.createElement('label');
      wrap.style.display = 'flex'; wrap.style.alignItems = 'center'; wrap.style.gap = '6px';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!rawValue;
      const t2 = document.createElement('span');
      t2.textContent = rawValue ? t('enabled') : t('disabled');
      const sync = () => { t2.textContent = cb.checked ? t('enabled') : t('disabled'); setValue(cb.checked); };
      cb.addEventListener('change', sync);
      wrap.appendChild(cb); wrap.appendChild(t2);
      row.appendChild(wrap);
    } else if (typeof rawValue === 'number') {
      // 4) 数字：数字框
      const inp = document.createElement('input');
      inp.type = 'number';
      inp.value = String(rawValue);
      const minimum = typeMeta.minimum !== undefined ? typeMeta.minimum : typeMeta.min;
      const maximum = typeMeta.maximum !== undefined ? typeMeta.maximum : typeMeta.max;
      if (minimum !== undefined) inp.min = String(minimum);
      if (maximum !== undefined) inp.max = String(maximum);
      inp.addEventListener('change', () => {
        const n = Number(inp.value);
        setValue(Number.isNaN(n) ? 0 : n);
      });
      row.appendChild(inp);
    } else if (Array.isArray(rawValue) && (typeName === 'multi_selection' || (!typeName && options.length)) && options.length) {
      // 5) multi_selection：多选下拉（多选框）
      const wrap = document.createElement('div');
      const sel = document.createElement('select');
      sel.multiple = true;
      sel.size = Math.min(6, options.length + 1);
      const curArr = (Array.isArray(rawValue) ? rawValue : []).map(String);
      for (let index = 0; index < options.length; index++) {
        const op = options[index];
        const o = document.createElement('option');
        o.value = String(index);
        o.textContent = String(optionLabels[index] || op);
        if (curArr.includes(String(op))) o.selected = true;
        sel.appendChild(o);
      }
      const hint = document.createElement('div');
      hint.className = 'cfg-desc';
      hint.textContent = t('holdCtrlMulti');
      sel.addEventListener('change', () => {
        setValue(Array.from(sel.selectedOptions).map((o) => options[Number(o.value)]));
      });
      wrap.appendChild(sel); wrap.appendChild(hint);
      row.appendChild(wrap);
    } else if (typeName === 'cond_sequence_editor' || (Array.isArray(rawValue) && rawValue.some((item) => item && typeof item === 'object'))) {
      // 6) 结构化列表：JSON 编辑，保留条件序列对象结构
      const inp = document.createElement('textarea');
      inp.value = JSON.stringify(Array.isArray(rawValue) ? rawValue : [], null, 2);
      const hint = document.createElement('div'); hint.className = 'cfg-json-hint'; hint.textContent = t('structuredJsonHint');
      inp.addEventListener('change', () => {
        try {
          const parsed = JSON.parse(inp.value);
          if (!Array.isArray(parsed)) throw new Error();
          inp.classList.remove('cfg-json-error');
          setValue(parsed);
        } catch {
          inp.classList.add('cfg-json-error');
        }
      });
      row.appendChild(inp); row.appendChild(hint);
    } else if (Array.isArray(rawValue)) {
      // 7) 普通/可排序 list：每行一项，避免值本身含逗号时被破坏
      const inp = document.createElement('textarea');
      inp.value = (Array.isArray(rawValue) ? rawValue : []).join('\n');
      if (optionsAvailable.length) {
        const availableLabels = Array.isArray(typeMeta.options_available_labels) ? typeMeta.options_available_labels : optionsAvailable;
        inp.title = t('selectedOptionsHint', { values: availableLabels.map(String).join(', ') });
      }
      inp.addEventListener('change', () => {
        setValue(inp.value.split(/\r?\n/).map((s) => s.trim()).filter(Boolean));
      });
      row.appendChild(inp);
    } else if (typeof rawValue === 'string' && (typeName === 'text_edit' || rawValue.includes('\n') || rawValue.length > 80)) {
      // 8) 多行或长文本
      const inp = document.createElement('textarea');
      inp.value = rawValue;
      inp.addEventListener('change', () => setValue(inp.value));
      row.appendChild(inp);
    } else {
      // 9) 其他（str 等）：文本框
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.value = rawValue === undefined || rawValue === null ? '' : String(rawValue);
      inp.addEventListener('change', () => setValue(inp.value));
      row.appendChild(inp);
    }
    row.dataset.key = field.key;
    container.appendChild(row);
    return row;
  }

  function fieldValue(field, config) {
    return config.params && field.key in config.params
      ? config.params[field.key]
      : (field.value !== undefined ? field.value : field.default);
  }

  function subConfigRules(typeMeta) {
    const rules = typeMeta && typeof typeMeta.sub_configs === 'object' ? typeMeta.sub_configs : null;
    return rules && !Array.isArray(rules) ? rules : null;
  }

  function normalizeSubConfigKeys(value) {
    if (typeof value === 'string') return [value];
    return Array.isArray(value) ? value.filter((key) => typeof key === 'string') : [];
  }

  function booleanSubConfigRules(field, config) {
    if (!field || (typeof field.default !== 'boolean' && typeof field.value !== 'boolean')) return null;
    const rules = subConfigRules(field.type);
    if (!rules) return null;
    const result = {};
    for (const [choice, controlled] of Object.entries(rules)) {
      const normalized = String(choice).toLowerCase();
      if (normalized === 'true' || normalized === 'false') {
        result[normalized] = normalizeSubConfigKeys(controlled);
      }
    }
    return Object.keys(result).length ? result : null;
  }

  function booleanFieldValue(field, config) {
    const value = fieldValue(field, config);
    if (typeof value === 'boolean') return value;
    if (typeof value === 'string') return value.trim().toLowerCase() === 'true';
    return Boolean(value);
  }

  function optionSubConfigGroups(field, config) {
    if (!field || booleanSubConfigRules(field, config)) return [];
    const rules = subConfigRules(field.type);
    if (!rules) return [];
    const labels = field.type?.sub_config_labels || {};
    return Object.entries(rules).map(([choice, controlled]) => ({
      key: String(choice),
      label: String(labels[choice] || choice),
      children: normalizeSubConfigKeys(controlled),
    }));
  }

  function buildRuntimeFields(panel, config) {
    const title = document.createElement('div');
    title.className = 'cfg-section-title';
    title.textContent = t('launchSettings');
    panel.appendChild(title);

    const addText = (labelText, desc, value, onChange, multiline) => {
      const row = document.createElement('div');
      row.className = 'cfg-field';
      const label = document.createElement('label'); label.textContent = labelText; row.appendChild(label);
      const help = document.createElement('div'); help.className = 'cfg-desc'; help.textContent = desc; row.appendChild(help);
      const input = document.createElement(multiline ? 'textarea' : 'input');
      if (!multiline) input.type = 'text';
      input.value = value || '';
      input.addEventListener('change', () => onChange(input.value));
      row.appendChild(input); panel.appendChild(row);
    };

    addText(t('extraArgs'), t('extraArgsHint'), config.extraArgs || '', (value) => {
      if (value.trim()) config.extraArgs = value.trim(); else delete config.extraArgs;
    }, false);
    addText(t('environmentVariables'), t('environmentHint'), Object.entries(config.env || {}).map(([k, v]) => k + '=' + v).join('\n'), (value) => {
      const env = {};
      for (const line of value.split(/\r?\n/)) {
        const index = line.indexOf('=');
        if (index <= 0) continue;
        const key = line.slice(0, index).trim();
        if (/^[A-Za-z_][A-Za-z0-9_]*$/.test(key)) env[key] = line.slice(index + 1);
      }
      if (Object.keys(env).length) config.env = env; else delete config.env;
    }, true);

    const timeoutRow = document.createElement('div'); timeoutRow.className = 'cfg-field';
    const timeoutLabel = document.createElement('label'); timeoutLabel.textContent = t('timeoutSeconds'); timeoutRow.appendChild(timeoutLabel);
    const timeoutDesc = document.createElement('div'); timeoutDesc.className = 'cfg-desc'; timeoutDesc.textContent = t('timeoutHint'); timeoutRow.appendChild(timeoutDesc);
    const timeout = document.createElement('input'); timeout.type = 'number'; timeout.min = '0'; timeout.step = '1'; timeout.value = String(config.timeout || 0);
    timeout.addEventListener('change', () => { const value = Number(timeout.value); if (value > 0) config.timeout = value; else delete config.timeout; });
    timeoutRow.appendChild(timeout); panel.appendChild(timeoutRow);
  }

  /** 渲染某任务的参数配置面板 */
  function buildConfigPanel(card, task, schema) {
    const panel = document.createElement('div');
    panel.className = 'cfg-panel';
    const savedConfig = taskConfigs[taskKey(task)] || {};
    const config = Object.assign({}, savedConfig, {
      params: Object.assign({}, savedConfig.params || {}),
    });
    if (schema && schema.broken) {
      const br = document.createElement('div');
      br.className = 'cfg-broken';
      br.textContent = '⚠ ' + t('schemaFailed', { error: schema.error || '' });
      panel.appendChild(br);
    } else if (schema && schema.fields && schema.fields.length) {
      const fieldsHost = document.createElement('div');
      fieldsHost.className = 'cfg-fields';
      panel.appendChild(fieldsHost);
      const fieldByKey = Object.fromEntries(schema.fields.map((field) => [field.key, field]));
      const groups = schema.configGroups && typeof schema.configGroups === 'object' ? schema.configGroups : {};
      const selectorKey = schema.groupSelector && fieldByKey[schema.groupSelector] ? schema.groupSelector : '';

      const rebuildFields = () => {
        fieldsHost.replaceChildren();
        const rowByKey = {};
        const renderedKeys = new Set();
        const renderedGroupKeys = new Set();
        const inlineRulesByParent = {};

        for (const field of schema.fields) {
          const rules = booleanSubConfigRules(field, config);
          if (rules) inlineRulesByParent[field.key] = rules;
        }

        const applyInlineVisibility = () => {
          const parentsByChild = {};
          for (const [parentKey, rules] of Object.entries(inlineRulesByParent)) {
            for (const controlled of Object.values(rules)) {
              for (const child of controlled) {
                (parentsByChild[child] = parentsByChild[child] || []).push(parentKey);
              }
            }
          }
          const visible = (key, checking = new Set()) => {
            if (checking.has(key)) return false;
            const parents = parentsByChild[key] || [];
            if (!parents.length) return true;
            const next = new Set(checking); next.add(key);
            return parents.every((parentKey) => {
              const parent = fieldByKey[parentKey];
              if (!parent || !visible(parentKey, next)) return false;
              const choice = String(booleanFieldValue(parent, config));
              return (inlineRulesByParent[parentKey]?.[choice] || []).includes(key);
            });
          };
          for (const [key, rows] of Object.entries(rowByKey)) {
            for (const row of rows) row.style.display = visible(key) ? '' : 'none';
          }
        };

        const renderField = (key, container, onChange = applyInlineVisibility, subConfig = false, duplicate = false) => {
          if ((!duplicate && renderedKeys.has(key)) || !fieldByKey[key]) return false;
          if (!duplicate) renderedKeys.add(key);
          const row = buildField(container, task, fieldByKey[key], config, onChange);
          row.classList.toggle('cfg-subconfig', subConfig);
          (rowByKey[key] = rowByKey[key] || []).push(row);
          return true;
        };

        let renderFieldTree;

        const renderCollapseGroup = (groupKey, label, children, container, path, options = {}) => {
          if (renderedGroupKeys.has(groupKey)) return false;
          renderedGroupKeys.add(groupKey);
          const headerField = options.headerField && fieldByKey[options.headerField]
            ? options.headerField
            : '';
          const groupChildren = [...new Set(children)].filter((key) => key && key !== headerField);

          const group = document.createElement('div');
          group.className = 'cfg-group';
          const header = document.createElement('div');
          header.className = 'cfg-group-header';
          if (headerField) {
            renderField(headerField, header, applyInlineVisibility, false, true);
          } else {
            const title = document.createElement('div');
            title.className = 'cfg-group-title';
            title.textContent = label;
            header.appendChild(title);
          }

          const toggle = document.createElement('button');
          toggle.className = 'cfg-group-toggle secondary';
          const body = document.createElement('div');
          body.className = 'cfg-group-body';
          const stateKey = taskKey(task) + '::' + path.join('>');
          const isOpen = openConfigGroups.has(stateKey) ? openConfigGroups.get(stateKey) : false;
          const setOpen = (open) => {
            group.classList.toggle('open', open);
            toggle.textContent = open ? '▲' : '▼';
            toggle.title = open ? t('collapseParameters') : t('parameters');
            openConfigGroups.set(stateKey, open);
          };
          toggle.addEventListener('click', () => setOpen(!group.classList.contains('open')));
          header.appendChild(toggle);
          group.appendChild(header);
          group.appendChild(body);
          container.appendChild(group);

          if (headerField && inlineRulesByParent[headerField]) {
            const next = new Set(options.checking || []); next.add(headerField);
            for (const child of [...new Set(Object.values(inlineRulesByParent[headerField]).flat())]) {
              renderFieldTree(child, body, [...path, child], true, next);
            }
          }

          for (const child of groupChildren) {
            if (groups[child]) {
              renderCollapseGroup(
                child,
                (schema.groupLabels && schema.groupLabels[child]) || child,
                groups[child],
                body,
                [...path, child],
                {
                  headerField: fieldByKey[child] ? child : '',
                  checking: options.checking,
                  duplicateChildren: options.duplicateChildren,
                },
              );
            } else {
              renderFieldTree(child, body, [...path, child], options.inlineChildren === true, options.checking || new Set(), options.duplicateChildren === true);
            }
          }
          if (!body.childElementCount) {
            toggle.style.display = 'none';
            group.classList.add('open');
          } else {
            setOpen(Boolean(isOpen));
          }
          return group;
        };

        renderFieldTree = (key, container, path, subConfig = false, checking = new Set(), duplicate = false) => {
          if (checking.has(key) || !fieldByKey[key]) return false;
          const next = new Set(checking); next.add(key);
          const rendered = renderField(key, container, applyInlineVisibility, subConfig, duplicate);
          if (!rendered) return false;

          const inlineRules = inlineRulesByParent[key];
          if (inlineRules) {
            for (const child of [...new Set(Object.values(inlineRules).flat())]) {
              renderFieldTree(child, container, [...path, child], true, next, duplicate);
            }
          }
          for (const group of optionSubConfigGroups(fieldByKey[key], config)) {
            renderCollapseGroup(
              `${key}:${group.key}`,
              group.label,
              group.children,
              container,
              [...path, 'sub-config', group.key],
              { checking: new Set(), duplicateChildren: true },
            );
          }
          return true;
        };

        const optionControlled = new Set();
        for (const field of schema.fields) {
          for (const group of optionSubConfigGroups(field, config)) {
            for (const key of group.children) optionControlled.add(key);
          }
        }
        const inlineControlled = new Set();
        for (const rules of Object.values(inlineRulesByParent)) {
          for (const keys of Object.values(rules)) for (const key of keys) inlineControlled.add(key);
        }
        const declaredGroupChildren = new Set();
        const declaredGroupNames = new Set(Object.keys(groups));
        for (const children of Object.values(groups)) {
          if (Array.isArray(children)) for (const key of children) declaredGroupChildren.add(key);
        }

        for (const field of schema.fields) {
          if (field.key === selectorKey || optionControlled.has(field.key) || inlineControlled.has(field.key) || declaredGroupNames.has(field.key) || declaredGroupChildren.has(field.key)) continue;
          renderFieldTree(field.key, fieldsHost, ['field', field.key]);
        }

        const nestedGroupNames = new Set();
        for (const [parent, children] of Object.entries(groups)) {
          if (!Array.isArray(children)) continue;
          for (const child of children) {
            if (child !== parent && groups[child]) nestedGroupNames.add(child);
          }
        }
        const rootGroupNames = Object.keys(groups).filter((key) => !nestedGroupNames.has(key));
        for (const groupKey of rootGroupNames) {
          renderCollapseGroup(
            groupKey,
            (schema.groupLabels && schema.groupLabels[groupKey]) || groupKey,
            groups[groupKey] || [],
            fieldsHost,
            ['config-group', groupKey],
            {
              headerField: fieldByKey[groupKey] ? groupKey : '',
              duplicateChildren: true,
            },
          );
        }
        for (const groupKey of Object.keys(groups)) {
          if (renderedGroupKeys.has(groupKey)) continue;
          renderCollapseGroup(
            groupKey,
            (schema.groupLabels && schema.groupLabels[groupKey]) || groupKey,
            groups[groupKey] || [],
            fieldsHost,
            ['config-group', groupKey],
            {
              headerField: fieldByKey[groupKey] ? groupKey : '',
              duplicateChildren: true,
            },
          );
        }

        for (const field of schema.fields) {
          if (field.key === selectorKey || renderedKeys.has(field.key) || optionControlled.has(field.key) || declaredGroupNames.has(field.key) || declaredGroupChildren.has(field.key)) continue;
          renderFieldTree(field.key, fieldsHost, ['remaining', field.key], inlineControlled.has(field.key));
        }
        applyInlineVisibility();
      };

      rebuildFields();
      buildRuntimeFields(panel, config);
      const actions = document.createElement('div');
      actions.className = 'cfg-actions';
      const save = document.createElement('button');
      save.textContent = '💾 ' + t('saveParameters');
      save.addEventListener('click', () => {
        vscode.postMessage({ type: 'saveConfig', task, config });
      });
      const reset = document.createElement('button');
      reset.className = 'secondary';
      reset.textContent = '↺ ' + t('reset');
      reset.addEventListener('click', () => {
        const fresh = Object.assign({}, taskConfigs[taskKey(task)] || {});
        delete fresh.params;
        vscode.postMessage({ type: 'saveConfig', task, config: fresh });
      });
      actions.appendChild(save); actions.appendChild(reset);
      panel.appendChild(actions);
    } else {
      const e = document.createElement('div');
      e.className = 'cfg-empty';
      e.textContent = t('noConfigParameters');
      panel.appendChild(e);
      buildRuntimeFields(panel, config);
      const actions = document.createElement('div');
      actions.className = 'cfg-actions';
      const save = document.createElement('button'); save.textContent = '💾 ' + t('saveLaunchSettings');
      save.addEventListener('click', () => vscode.postMessage({ type: 'saveConfig', task, config }));
      actions.appendChild(save); panel.appendChild(actions);
    }
    return panel;
  }

  function render(tasks) {
    currentTasks = tasks;
    tasksEl.innerHTML = '';
    emptyEl.style.display = tasks.length ? 'none' : '';
    for (const task of tasks) {
      const card = document.createElement('div');
      card.className = 'task';
      const nm = document.createElement('div');
      nm.className = 'name';
      const schema = schemas[taskKey(task)];
      const taskDisplayName = schema && schema.displayName ? schema.displayName : task.displayName;
      nm.textContent = taskDisplayName;
      if (schema && schema.kind) {
        const kind = document.createElement('span'); kind.className = 'kind'; kind.textContent = schema.kind === 'trigger' ? t('triggerTask') : t('oneTimeTask'); nm.appendChild(kind);
      }
      nm.title = task.module;
      const cl = document.createElement('div');
      cl.className = 'cls';
      cl.textContent = task.className;
      const desc = document.createElement('div');
      desc.className = 'description';
      desc.textContent = schema && schema.description ? schema.description : '';
      desc.style.display = desc.textContent ? '' : 'none';
      const launchBtn = document.createElement('button');
      launchBtn.className = 'launch-btn';
      launchBtn.textContent = '▶ ' + t('launch');
      launchBtn.dataset.module = task.module;
      launchBtn.dataset.cls = task.className;
      launchBtn.dataset.name = taskDisplayName;
      launchBtn.addEventListener('click', () => {
        if (running) return;
        vscode.postMessage({ type: 'launch', task: { module: task.module, className: task.className, displayName: taskDisplayName } });
      });
      const stopBtn = document.createElement('button');
      stopBtn.className = 'stop-btn';
      stopBtn.textContent = '⏹ ' + t('stop');
      stopBtn.dataset.module = task.module;
      stopBtn.dataset.cls = task.className;
      stopBtn.dataset.name = taskDisplayName;
      stopBtn.addEventListener('click', () => {
        if (!running) return;
        vscode.postMessage({ type: 'stop', task: { module: task.module, className: task.className, displayName: taskDisplayName } });
      });
      const cfgToggle = document.createElement('button');
      cfgToggle.className = 'cfg-toggle';
      cfgToggle.textContent = '⚙ ' + t('parameters');
      const panel = buildConfigPanel(card, task, schema);
      if (openPanels.has(taskKey(task))) {
        panel.classList.add('open');
        cfgToggle.textContent = '▲ ' + t('collapseParameters');
      }
      cfgToggle.addEventListener('click', () => {
        const open = panel.classList.toggle('open');
        if (open) openPanels.add(taskKey(task)); else openPanels.delete(taskKey(task));
        cfgToggle.textContent = open ? '▲ ' + t('collapseParameters') : '⚙ ' + t('parameters');
      });
      card.appendChild(nm);
      card.appendChild(cl);
      card.appendChild(desc);
      card.appendChild(launchBtn);
      card.appendChild(stopBtn);
      card.appendChild(cfgToggle);
      card.appendChild(panel);
      tasksEl.appendChild(card);
    }
    setRunning(running, runningTaskKey);
  }

  function setRunning(r, taskOrKey) {
    running = r;
    if (typeof taskOrKey === 'string') runningTaskKey = taskOrKey;
    else if (taskOrKey) runningTaskKey = taskKey(taskOrKey);
    if (!r) runningTaskKey = '';
    for (const b of tasksEl.querySelectorAll('.launch-btn')) {
      b.disabled = r;
      const isCurrent = taskKey({ module: b.dataset.module, className: b.dataset.cls }) === runningTaskKey;
      b.textContent = r && isCurrent ? '⏳ ' + t('running') : '▶ ' + t('launch');
    }
    for (const b of tasksEl.querySelectorAll('.stop-btn')) {
      const isCurrent = taskKey({ module: b.dataset.module, className: b.dataset.cls }) === runningTaskKey;
      b.disabled = !r || !isCurrent;
    }
  }

  refreshBtn.addEventListener('click', () => vscode.postMessage({ type: 'refresh' }));
  window.addEventListener('message', (e) => {
    const msg = e.data;
    switch (msg.type) {
      case 'tasks':
        schemas = msg.schemas || schemas;
        render(msg.tasks || []);
        break;
      case 'schemas':
        schemas = msg.schemas || schemas;
        render(currentTasks);
        break;
      case 'taskConfigs':
        taskConfigs = msg.configs || {};
        render(currentTasks);
        break;
      case 'status': setStatus(msg.level, msg.text); break;
      case 'running':
        setRunning(msg.running, msg.task);
        if (msg.stopping) setStatus('warn', msg.timedOut ? t('timeoutStopping') : t('stopping'));
        else if (msg.error) setStatus('error', msg.error);
        else if (msg.stopped) setStatus('warn', msg.timedOut ? t('taskTimedOut') : t('taskStopped'));
        else if (msg.running === false && msg.code === 0) setStatus('ok', t('taskCompleted'));
        else if (msg.running === false) setStatus('error', t('taskFailed'));
        break;
    }
  });
  vscode.postMessage({ type: 'ready' });
  vscode.postMessage({ type: 'loadConfigs' });
</script>
</body>
