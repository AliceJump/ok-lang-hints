<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-__CSP_NONCE__'">
<title>ok-script 任务启动</title>
<style>
  body {
    color: var(--vscode-editor-foreground);
    background: var(--vscode-editor-background);
    font-family: var(--vscode-font-family);
    font-size: var(--vscode-font-size, 13px);
    margin: 0;
    padding: 10px 12px 20px;
  }
  .toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  button {
    background: var(--vscode-button-background);
    color: var(--vscode-button-foreground);
    border: none;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
  }
  button:hover { background: var(--vscode-button-hoverBackground); }
  button.secondary { background: var(--vscode-button-secondaryBackground); color: var(--vscode-button-secondaryForeground); }
  .task {
    border: 1px solid var(--vscode-panel-border, rgba(128,128,128,.25));
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 6px;
    background: var(--vscode-editorWidget-background, rgba(128,128,128,.06));
  }
  .task:hover { border-color: var(--vscode-focusBorder); }
  .task .name { font-weight: 600; margin-bottom: 2px; }
  .task .cls { opacity: .6; font-size: 11px; }
  .task .description { opacity: .75; font-size: 11px; margin-top: 4px; white-space: pre-wrap; }
  .task .kind { float: right; opacity: .75; font-size: 10px; font-weight: normal; }
  .task .launch-btn {
    margin-top: 6px;
    width: 100%;
  }
  .task .launch-btn:disabled { opacity: .5; cursor: not-allowed; }
  .task .stop-btn {
    margin-top: 6px;
    width: 100%;
    background: var(--vscode-button-secondaryBackground);
    color: var(--vscode-button-secondaryForeground);
  }
  .task .stop-btn:disabled { opacity: .5; cursor: not-allowed; }
  /* 参数配置区 */
  .cfg-toggle {
    margin-top: 6px;
    width: 100%;
    background: var(--vscode-button-secondaryBackground);
    color: var(--vscode-button-secondaryForeground);
  }
  .cfg-panel {
    display: none;
    margin-top: 8px;
    border-top: 1px solid var(--vscode-panel-border, rgba(128,128,128,.2));
    padding-top: 8px;
  }
  .cfg-panel.open { display: block; }
  .cfg-field { margin-bottom: 8px; }
  .cfg-field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 2px;
    cursor: pointer;
  }
  .cfg-field .cfg-desc {
    font-size: 11px;
    opacity: .6;
    margin-bottom: 4px;
    white-space: pre-wrap;
    line-height: 1.4;
  }
  .cfg-field select,
  .cfg-field input[type=text],
  .cfg-field input[type=number],
  .cfg-field textarea {
    width: 100%;
    box-sizing: border-box;
    background: var(--vscode-input-background);
    color: var(--vscode-input-foreground);
    border: 1px solid var(--vscode-input-border, transparent);
    border-radius: 3px;
    padding: 3px 6px;
    font-size: 12px;
  }
  .cfg-field textarea { min-height: 72px; resize: vertical; font-family: inherit; }
  .cfg-field input[type=checkbox] { accent-color: var(--vscode-focusBorder); }
  .cfg-actions {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }
  .cfg-actions button { flex: 1; }
  .cfg-section-title { font-size: 11px; font-weight: 700; opacity: .75; margin: 10px 0 6px; }
  .cfg-broken { opacity: .7; font-size: 12px; margin-top: 6px; }
  .cfg-empty { opacity: .6; font-size: 12px; margin-top: 6px; }
  .status { margin-top: 8px; padding: 6px 8px; border-radius: 4px; font-size: 12px; }
  .status.warn { background: var(--vscode-inputValidation-warningBackground, rgba(255,193,7,.15)); }
  .status.error { background: var(--vscode-inputValidation-errorBackground, rgba(255,0,0,.15)); }
  .status.ok { background: var(--vscode-inputValidation-infoBackground, rgba(0,122,204,.15)); }
  .empty { opacity: .6; text-align: center; margin-top: 32px; line-height: 1.8; }
</style>
</head>
<body>
  <div class="toolbar">
    <button id="refresh" class="secondary">↻ 刷新</button>
  </div>
  <div id="tasks"></div>
  <div id="status" class="status" style="display:none"></div>
  <div id="empty" class="empty" style="display:none">未找到任务。<br>请先在设置中配置项目路径。</div>
<script nonce="__CSP_NONCE__">
  const vscode = acquireVsCodeApi();
  const tasksEl = document.getElementById('tasks');
  const statusEl = document.getElementById('status');
  const emptyEl = document.getElementById('empty');
  const refreshBtn = document.getElementById('refresh');
  let running = false;
  // 已加载的 schema 与任务配置均以 module::className 为键。
  let schemas = {};
  let taskConfigs = {};
  let currentTasks = [];
  let runningTaskKey = '';
  const openPanels = new Set();

  function setStatus(level, text) {
    if (!text) { statusEl.style.display = 'none'; return; }
    statusEl.style.display = '';
    statusEl.className = 'status ' + level;
    statusEl.textContent = text;
  }

  function taskKey(t) { return t.module + '::' + t.className; }

  /** 渲染单个参数字段控件；值变更时实时写回 config.params */
  function buildField(container, t, field, config, onChange) {
    const row = document.createElement('div');
    row.className = 'cfg-field';
    const label = document.createElement('label');
    label.textContent = field.key;
    label.title = field.key;
    row.appendChild(label);
    if (field.desc) {
      const d = document.createElement('div');
      d.className = 'cfg-desc';
      d.textContent = field.desc;
      row.appendChild(d);
    }
    const setValue = (v) => {
      config.params = config.params || {};
      config.params[field.key] = v;
      if (onChange) onChange();
    };
    const typeMeta = field.type || {};
    const rawValue = config.params && field.key in config.params
      ? config.params[field.key]
      : (field.value !== undefined ? field.value : field.default);
    const typeName = String(typeMeta.type || '');
    const options = Array.isArray(typeMeta.options) ? typeMeta.options : [];
    const optionsAvailable = Array.isArray(typeMeta.options_available) ? typeMeta.options_available : [];

    // 1) drop_down（显式或仅声明 options）：下拉
    if ((typeName === 'drop_down' || (!typeName && options.length && !Array.isArray(rawValue))) && options.length) {
      const sel = document.createElement('select');
      const cur = String(rawValue === undefined ? '' : rawValue);
      let hasCur = false;
      for (let index = 0; index < options.length; index++) {
        const op = options[index];
        const o = document.createElement('option');
        o.value = String(index);
        o.textContent = String(op);
        if (String(op) === cur) { o.selected = true; hasCur = true; }
        sel.appendChild(o);
      }
      if (!hasCur) {
        const o = document.createElement('option');
        o.value = '-1'; o.textContent = cur + '（当前）'; o.selected = true;
        sel.appendChild(o);
      }
      sel.addEventListener('change', () => {
        const index = Number(sel.value);
        if (index >= 0 && index < options.length) setValue(options[index]);
      });
      row.appendChild(sel);
    } else if (typeof rawValue === 'boolean') {
      // 2) 布尔：开关
      const wrap = document.createElement('label');
      wrap.style.display = 'flex'; wrap.style.alignItems = 'center'; wrap.style.gap = '6px';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!rawValue;
      const t2 = document.createElement('span');
      t2.textContent = rawValue ? '开启' : '关闭';
      const sync = () => { t2.textContent = cb.checked ? '开启' : '关闭'; setValue(cb.checked); };
      cb.addEventListener('change', sync);
      wrap.appendChild(cb); wrap.appendChild(t2);
      row.appendChild(wrap);
    } else if (typeof rawValue === 'number') {
      // 3) 数字：数字框
      const inp = document.createElement('input');
      inp.type = 'number';
      inp.value = String(rawValue);
      const minimum = typeMeta.minimum !== undefined ? typeMeta.minimum : typeMeta.min;
      const maximum = typeMeta.maximum !== undefined ? typeMeta.maximum : typeMeta.max;
      if (minimum !== undefined) inp.min = String(minimum);
      if (maximum !== undefined) inp.max = String(maximum);
      inp.addEventListener('change', () => {
        const n = Number(inp.value);
        setValue(Number.isNaN(n) ? 0 : n);
      });
      row.appendChild(inp);
    } else if (Array.isArray(rawValue) && (typeName === 'multi_selection' || (!typeName && options.length)) && options.length) {
      // 4) multi_selection：多选下拉（多选框）
      const wrap = document.createElement('div');
      const sel = document.createElement('select');
      sel.multiple = true;
      sel.size = Math.min(6, options.length + 1);
      const curArr = (Array.isArray(rawValue) ? rawValue : []).map(String);
      for (let index = 0; index < options.length; index++) {
        const op = options[index];
        const o = document.createElement('option');
        o.value = String(index);
        o.textContent = String(op);
        if (curArr.includes(String(op))) o.selected = true;
        sel.appendChild(o);
      }
      const hint = document.createElement('div');
      hint.className = 'cfg-desc';
      hint.textContent = '按住 Ctrl 多选';
      sel.addEventListener('change', () => {
        setValue(Array.from(sel.selectedOptions).map((o) => options[Number(o.value)]));
      });
      wrap.appendChild(sel); wrap.appendChild(hint);
      row.appendChild(wrap);
    } else if (Array.isArray(rawValue)) {
      // 5) 普通/可排序 list：每行一项，避免值本身含逗号时被破坏
      const inp = document.createElement('textarea');
      inp.value = (Array.isArray(rawValue) ? rawValue : []).join('\n');
      if (optionsAvailable.length) {
        inp.title = '可选值: ' + optionsAvailable.map(String).join(', ');
      }
      inp.addEventListener('change', () => {
        setValue(inp.value.split(/\r?\n/).map((s) => s.trim()).filter(Boolean));
      });
      row.appendChild(inp);
    } else if (typeof rawValue === 'string' && (typeName === 'text_edit' || rawValue.includes('\n') || rawValue.length > 80)) {
      // 6) 多行或长文本
      const inp = document.createElement('textarea');
      inp.value = rawValue;
      inp.addEventListener('change', () => setValue(inp.value));
      row.appendChild(inp);
    } else {
      // 7) 其他（str 等）：文本框
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.value = rawValue === undefined || rawValue === null ? '' : String(rawValue);
      inp.addEventListener('change', () => setValue(inp.value));
      row.appendChild(inp);
    }
    row.dataset.key = field.key;
    container.appendChild(row);
    return row;
  }

  function choiceKeys(value) {
    const values = Array.isArray(value) ? value : [value];
    const keys = [];
    for (const item of values) {
      const raw = String(item);
      keys.push(raw, raw.toLowerCase(), raw.charAt(0).toUpperCase() + raw.slice(1).toLowerCase());
    }
    return keys;
  }

  function activeSubConfigKeys(typeMeta, value) {
    const rules = typeMeta && typeof typeMeta.sub_configs === 'object' ? typeMeta.sub_configs : null;
    if (!rules) return [];
    const active = [];
    for (const choice of choiceKeys(value)) {
      const controlled = rules[choice];
      const keys = typeof controlled === 'string' ? [controlled] : (Array.isArray(controlled) ? controlled : []);
      for (const key of keys) if (!active.includes(key)) active.push(key);
    }
    return active;
  }

  function buildRuntimeFields(panel, config) {
    const title = document.createElement('div');
    title.className = 'cfg-section-title';
    title.textContent = '启动设置';
    panel.appendChild(title);

    const addText = (labelText, desc, value, onChange, multiline) => {
      const row = document.createElement('div');
      row.className = 'cfg-field';
      const label = document.createElement('label'); label.textContent = labelText; row.appendChild(label);
      const help = document.createElement('div'); help.className = 'cfg-desc'; help.textContent = desc; row.appendChild(help);
      const input = document.createElement(multiline ? 'textarea' : 'input');
      if (!multiline) input.type = 'text';
      input.value = value || '';
      input.addEventListener('change', () => onChange(input.value));
      row.appendChild(input); panel.appendChild(row);
    };

    addText('额外参数', '支持引号语法，或填写 JSON 字符串数组，例如 ["--headless", "--profile", "A B"]。', config.extraArgs || '', (value) => {
      if (value.trim()) config.extraArgs = value.trim(); else delete config.extraArgs;
    }, false);
    addText('环境变量', '每行 KEY=VALUE；仅传给当前任务子进程。', Object.entries(config.env || {}).map(([k, v]) => k + '=' + v).join('\n'), (value) => {
      const env = {};
      for (const line of value.split(/\r?\n/)) {
        const index = line.indexOf('=');
        if (index <= 0) continue;
        const key = line.slice(0, index).trim();
        if (/^[A-Za-z_][A-Za-z0-9_]*$/.test(key)) env[key] = line.slice(index + 1);
      }
      if (Object.keys(env).length) config.env = env; else delete config.env;
    }, true);

    const timeoutRow = document.createElement('div'); timeoutRow.className = 'cfg-field';
    const timeoutLabel = document.createElement('label'); timeoutLabel.textContent = '自动停止超时（秒）'; timeoutRow.appendChild(timeoutLabel);
    const timeoutDesc = document.createElement('div'); timeoutDesc.className = 'cfg-desc'; timeoutDesc.textContent = '0 表示不限时。'; timeoutRow.appendChild(timeoutDesc);
    const timeout = document.createElement('input'); timeout.type = 'number'; timeout.min = '0'; timeout.step = '1'; timeout.value = String(config.timeout || 0);
    timeout.addEventListener('change', () => { const value = Number(timeout.value); if (value > 0) config.timeout = value; else delete config.timeout; });
    timeoutRow.appendChild(timeout); panel.appendChild(timeoutRow);
  }

  /** 渲染某任务的参数配置面板 */
  function buildConfigPanel(card, t, schema) {
    const panel = document.createElement('div');
    panel.className = 'cfg-panel';
    const savedConfig = taskConfigs[taskKey(t)] || {};
    const config = Object.assign({}, savedConfig, {
      params: Object.assign({}, savedConfig.params || {}),
    });
    if (schema && schema.broken) {
      const br = document.createElement('div');
      br.className = 'cfg-broken';
      br.textContent = '⚠ 该任务 schema 采集失败，无法自动生成表单：' + (schema.error || '');
      panel.appendChild(br);
    } else if (schema && schema.fields && schema.fields.length) {
      const rowByKey = {};
      let applyVisibility = () => {};
      for (const f of schema.fields) rowByKey[f.key] = buildField(panel, t, f, config, () => applyVisibility());
      applyVisibility = () => {
        const parentsByChild = {};
        for (const parent of schema.fields) {
          const rules = parent.type && typeof parent.type.sub_configs === 'object' ? parent.type.sub_configs : null;
          if (!rules) continue;
          for (const keys of Object.values(rules)) {
            for (const key of (typeof keys === 'string' ? [keys] : (Array.isArray(keys) ? keys : []))) {
              (parentsByChild[key] = parentsByChild[key] || []).push(parent);
            }
          }
        }
        const visible = (key, checking) => {
          if (checking.has(key)) return false;
          const parents = parentsByChild[key] || [];
          if (!parents.length) return true;
          const next = new Set(checking); next.add(key);
          return parents.every((parent) => {
            if (!visible(parent.key, next)) return false;
            const value = config.params && parent.key in config.params ? config.params[parent.key] : parent.value;
            return activeSubConfigKeys(parent.type, value).includes(key);
          });
        };
        for (const [key, row] of Object.entries(rowByKey)) row.style.display = visible(key, new Set()) ? '' : 'none';
      };
      applyVisibility();
      buildRuntimeFields(panel, config);
      const actions = document.createElement('div');
      actions.className = 'cfg-actions';
      const save = document.createElement('button');
      save.textContent = '💾 保存参数';
      save.addEventListener('click', () => {
        vscode.postMessage({ type: 'saveConfig', task: t, config });
      });
      const reset = document.createElement('button');
      reset.className = 'secondary';
      reset.textContent = '↺ 重置';
      reset.addEventListener('click', () => {
        const fresh = Object.assign({}, taskConfigs[taskKey(t)] || {});
        delete fresh.params;
        vscode.postMessage({ type: 'saveConfig', task: t, config: fresh });
      });
      actions.appendChild(save); actions.appendChild(reset);
      panel.appendChild(actions);
    } else {
      const e = document.createElement('div');
      e.className = 'cfg-empty';
      e.textContent = '暂无可配置参数（schema 未就绪或该任务无 default_config）。';
      panel.appendChild(e);
      buildRuntimeFields(panel, config);
      const actions = document.createElement('div');
      actions.className = 'cfg-actions';
      const save = document.createElement('button'); save.textContent = '💾 保存启动设置';
      save.addEventListener('click', () => vscode.postMessage({ type: 'saveConfig', task: t, config }));
      actions.appendChild(save); panel.appendChild(actions);
    }
    return panel;
  }

  function render(tasks) {
    currentTasks = tasks;
    tasksEl.innerHTML = '';
    emptyEl.style.display = tasks.length ? 'none' : '';
    for (const t of tasks) {
      const card = document.createElement('div');
      card.className = 'task';
      const nm = document.createElement('div');
      nm.className = 'name';
      const schema = schemas[taskKey(t)];
      nm.textContent = schema && schema.displayName ? schema.displayName : t.displayName;
      if (schema && schema.kind) {
        const kind = document.createElement('span'); kind.className = 'kind'; kind.textContent = schema.kind === 'trigger' ? '触发任务' : '一次性'; nm.appendChild(kind);
      }
      nm.title = t.module;
      const cl = document.createElement('div');
      cl.className = 'cls';
      cl.textContent = t.className;
      const desc = document.createElement('div');
      desc.className = 'description';
      desc.textContent = schema && schema.description ? schema.description : '';
      desc.style.display = desc.textContent ? '' : 'none';
      const launchBtn = document.createElement('button');
      launchBtn.className = 'launch-btn';
      launchBtn.textContent = '▶ 启动';
      launchBtn.dataset.module = t.module;
      launchBtn.dataset.cls = t.className;
      launchBtn.dataset.name = t.displayName;
      launchBtn.addEventListener('click', () => {
        if (running) return;
        vscode.postMessage({ type: 'launch', task: { module: t.module, className: t.className, displayName: t.displayName } });
      });
      const stopBtn = document.createElement('button');
      stopBtn.className = 'stop-btn';
      stopBtn.textContent = '⏹ 停止';
      stopBtn.dataset.module = t.module;
      stopBtn.dataset.cls = t.className;
      stopBtn.dataset.name = t.displayName;
      stopBtn.addEventListener('click', () => {
        if (!running) return;
        vscode.postMessage({ type: 'stop', task: { module: t.module, className: t.className, displayName: t.displayName } });
      });
      const cfgToggle = document.createElement('button');
      cfgToggle.className = 'cfg-toggle';
      cfgToggle.textContent = '⚙ 参数';
      const panel = buildConfigPanel(card, t, schema);
      if (openPanels.has(taskKey(t))) {
        panel.classList.add('open');
        cfgToggle.textContent = '▲ 收起参数';
      }
      cfgToggle.addEventListener('click', () => {
        const open = panel.classList.toggle('open');
        if (open) openPanels.add(taskKey(t)); else openPanels.delete(taskKey(t));
        cfgToggle.textContent = open ? '▲ 收起参数' : '⚙ 参数';
      });
      card.appendChild(nm);
      card.appendChild(cl);
      card.appendChild(desc);
      card.appendChild(launchBtn);
      card.appendChild(stopBtn);
      card.appendChild(cfgToggle);
      card.appendChild(panel);
      tasksEl.appendChild(card);
    }
    setRunning(running, runningTaskKey);
  }

  function setRunning(r, taskOrKey) {
    running = r;
    if (typeof taskOrKey === 'string') runningTaskKey = taskOrKey;
    else if (taskOrKey) runningTaskKey = taskKey(taskOrKey);
    if (!r) runningTaskKey = '';
    for (const b of tasksEl.querySelectorAll('.launch-btn')) {
      b.disabled = r;
      const isCurrent = taskKey({ module: b.dataset.module, className: b.dataset.cls }) === runningTaskKey;
      b.textContent = r && isCurrent ? '⏳ 运行中…' : '▶ 启动';
    }
    for (const b of tasksEl.querySelectorAll('.stop-btn')) {
      const isCurrent = taskKey({ module: b.dataset.module, className: b.dataset.cls }) === runningTaskKey;
      b.disabled = !r || !isCurrent;
    }
  }

  refreshBtn.addEventListener('click', () => vscode.postMessage({ type: 'refresh' }));
  window.addEventListener('message', (e) => {
    const msg = e.data;
    switch (msg.type) {
      case 'tasks':
        schemas = msg.schemas || schemas;
        render(msg.tasks || []);
        break;
      case 'schemas':
        schemas = msg.schemas || schemas;
        render(currentTasks);
        break;
      case 'taskConfigs':
        taskConfigs = msg.configs || {};
        render(currentTasks);
        break;
      case 'status': setStatus(msg.level, msg.text); break;
      case 'running':
        setRunning(msg.running, msg.task);
        if (msg.stopping) setStatus('warn', msg.timedOut ? '任务已超时，正在停止…' : '正在停止任务…');
        else if (msg.error) setStatus('error', msg.error);
        else if (msg.stopped) setStatus('warn', msg.timedOut ? '任务超时并已停止，详见输出面板' : '任务已停止，详见输出面板');
        else if (msg.running === false && msg.code === 0) setStatus('ok', '任务完成，详见输出面板');
        else if (msg.running === false) setStatus('error', '任务异常结束，详见输出面板');
        break;
    }
  });
  vscode.postMessage({ type: 'ready' });
  vscode.postMessage({ type: 'loadConfigs' });
</script>
</body>
</html>
