name: Publish Marketplace

on:
  workflow_call:
    inputs:
      release_sha:
        type: string
        required: true
      tag:
        type: string
        required: true
      vsix:
        type: string
        required: true
    secrets:
      VSCE_PAT:
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download GitHub Release VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VSIX: ${{ inputs.vsix }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$VSIX" --dir .

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::notice::VSCE_PAT is not configured; Marketplace publishing was skipped."
            exit 0
          fi
          npm run publish:marketplace
