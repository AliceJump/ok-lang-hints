name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      JETBRAINS_PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
      PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
      CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
      VSCE_USE_OIDC: ${{ vars.VSCE_USE_OIDC }}

    steps:
      - name: Check out tagged source and submodule
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install VS Code dependencies
        run: npm ci

      - name: Verify synchronized release version
        id: version
        run: npm run --silent verify:version

      - name: Test and package VS Code extension
        run: |
          npm test
          npm run package

      - name: Test and package JetBrains plugin
        working-directory: jetbrains
        run: ./gradlew test buildPlugin verifyPluginStructure verifyPluginConfiguration verifyPlugin

      - name: Sign JetBrains plugin
        id: jetbrains_sign
        working-directory: jetbrains
        run: |
          set -euo pipefail
          if [ -n "${PRIVATE_KEY:-}" ] && [ -n "${PRIVATE_KEY_PASSWORD:-}" ] && [ -n "${CERTIFICATE_CHAIN:-}" ]; then
            ./gradlew signPlugin verifyPluginSignature
            signed=$(find build/distributions -maxdepth 1 -type f -name '*-signed.zip' -print -quit)
            if [ -z "$signed" ]; then
              echo "Signed JetBrains artifact was not generated." >&2
              exit 1
            fi
            artifact="build/release/${{ steps.version.outputs.jetbrains_zip }}"
            mkdir -p "$(dirname "$artifact")"
            cp "$signed" "$artifact"
            echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            artifact="build/distributions/${{ steps.version.outputs.jetbrains_zip }}"
            test -f "$artifact"
            echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::JetBrains signing secrets are incomplete; the unsigned ZIP will only be attached to GitHub Release."
          fi

      - name: Publish to Visual Studio Marketplace
        run: |
          set -euo pipefail
          if [ -n "${VSCE_PAT:-}" ]; then
            npm run publish:marketplace
          elif [ "${VSCE_USE_OIDC:-}" = "true" ]; then
            echo "VSCE_PAT is not configured; using Visual Studio Marketplace trusted publishing (OIDC)."
            output=$(mktemp)
            if ! npx @vscode/vsce publish --oidc --packagePath "${{ steps.version.outputs.vsix }}" 2>&1 | tee "$output"; then
              if grep -Eqi 'already exists|version .* exists|duplicate' "$output"; then
                echo "Visual Studio Marketplace already contains this version; skipping duplicate upload."
              else
                exit 1
              fi
            fi
          else
            echo "::notice::Neither VSCE_PAT nor VSCE_USE_OIDC=true is configured; Visual Studio Marketplace publishing was skipped."
          fi

      - name: Publish to JetBrains Marketplace
        run: |
          set -euo pipefail
          if [ -z "${JETBRAINS_PUBLISH_TOKEN:-}" ]; then
            echo "::notice::JETBRAINS_PUBLISH_TOKEN is not configured; JetBrains Marketplace publishing was skipped."
            exit 0
          fi
          if [ "${{ steps.jetbrains_sign.outputs.signed }}" != "true" ]; then
            echo "JetBrains Marketplace publishing requires all signing secrets." >&2
            exit 1
          fi
          version="${{ steps.version.outputs.version }}"
          if curl --silent --show-error --fail --location --range 0-0 \
            "https://plugins.jetbrains.com/plugin/download?pluginId=com.alicejump.oklanghints&version=$version" \
            --output /dev/null; then
            echo "JetBrains Marketplace already contains version $version; skipping duplicate upload."
            exit 0
          fi
          curl --fail-with-body \
            --header "Authorization: Bearer $JETBRAINS_PUBLISH_TOKEN" \
            -F "xmlId=com.alicejump.oklanghints" \
            -F "file=@jetbrains/${{ steps.jetbrains_sign.outputs.artifact }}" \
            https://plugins.jetbrains.com/api/updates/upload

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VSIX: ${{ steps.version.outputs.vsix }}
          JETBRAINS_ARTIFACT: jetbrains/${{ steps.jetbrains_sign.outputs.artifact }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; asset creation is skipped for this retry."
            exit 0
          fi
          gh release create "$TAG" \
            "$VSIX#$VSIX" \
            "$JETBRAINS_ARTIFACT#$(basename "$JETBRAINS_ARTIFACT")" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
